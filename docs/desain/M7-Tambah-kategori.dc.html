<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Tambah kategori HP</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tlq.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="position:relative;width:390px;height:844px;background:#fafafa;overflow:hidden">
  <div class="col" style="width:390px;height:844px">
    <div class="mtop">
      <div class="logo">TLQ</div>
      <div class="col grow"><span class="b t14">Master Data</span></div>
      <span class="btn sm p">+ Tambah</span>
    </div>
    <div class="col" style="padding:16px;gap:12px">
      <h1 class="h2">Kategori</h1>
      <div class="card p12 row g8"><span class="badge teal">Married</span><span class="t14 grow">Sebelum menikah</span><span class="t13 mut">5 kartu</span></div>
      <div class="card p12 row g8"><span class="badge teal">Married</span><span class="t14 grow">Hidup berpasangan</span><span class="t13 mut">5 kartu</span></div>
      <div class="card p12 row g8"><span class="badge teal">Penghafal Quran</span><span class="t14 grow">Menghafal</span><span class="t13 mut">3 kartu</span></div>
    </div>
  </div>
  <div class="scrim"></div>
  <div class="col" style="position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25)">
    <div style="width:40px;height:4px;border-radius:999px;background:#d4d4d8;margin:10px auto 0"></div>
    <div class="col g4" style="padding:12px 16px 4px">
      <h2 class="h2">Tambah kategori</h2>
      <span class="t13 mut">Muncul di aplikasi Scanner setelah disimpan dan aktif.</span>
    </div>
    <div class="col g12" style="padding:12px 16px">
      <div>
        <label class="lbl" for="tm">Tema</label>
        <select class="inp" id="tm"><option>Married</option><option>Penghafal Quran</option><option>Miracle</option><option>Parenting</option><option>Karir</option><option>Kesehatan</option><option>Emotional</option><option>Thalabul Ilmi</option></select>
      </div>
      <div>
        <label class="lbl" for="k">Kode</label>
        <input class="inp ro" id="k" value="C14" readonly>
      </div>
      <div>
        <label class="lbl" for="n">Nama kategori</label>
        <input class="inp err" id="n" value="Sebelum menikah">
        <div class="errt">Nama kategori sudah ada di tema Married. Pakai nama lain.</div>
      </div>
      <div>
        <label class="lbl" for="ds">Deskripsi (boleh dikosongkan)</label>
        <textarea class="inp" id="ds" rows="2" placeholder="Contoh: kartu untuk keluarga"></textarea>
      </div>
      <div class="row g12">
        <div style="width:96px"><label class="lbl" for="ur">Urutan</label><input class="inp" id="ur" value="4"></div>
        <div class="row g8 grow" style="padding-top:22px"><span class="sw" role="img" aria-label="Aktif"></span><span class="t14">Aktif</span></div>
      </div>
    </div>
    <div class="row g8" style="padding:8px 16px 20px">
      <button class="btn lg grow">Batal</button>
      <button class="btn p lg" style="flex:2">Simpan kategori</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
